[build-system]
requires = ["setuptools>=59.5"]
build-backend = "setuptools.build_meta"

[project]
name = "tversky-cross-calibration"
version = "1.0.0"
description = "Reproduction code for cross-calibration experiments with Tversky indices"
readme = "README.md"
requires-python = ">=3.9,<3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["tversky_cross_calibration*", "application*"]
